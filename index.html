<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <meta name="robots" content="noindex, nofollow">
    <title>Tessera v0.9.10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col items-center text-gray-800 select-none">

    <div id="top-ui-container" class="fixed top-[max(10px,1.5vmin)] left-0 w-full z-50 pointer-events-none px-[max(10px,1.5vmin)] flex flex-col items-center">
        <div id="top-inner-container" class="responsive-width relative flex flex-col gap-[1.2vmin] portrait:px-[1vmin] transition-all duration-500">
            <div class="w-full flex flex-row items-center gap-[0.75vmin] pointer-events-auto justify-between h-[max(32px,4.5vmin)] portrait:h-[max(52px,5vmin)]">
                <div id="filter-wrapper" class="relative z-50 flex-none h-full">
                    <button id="filter-main-btn" class="aesthetic-glass aesthetic-glass-hover h-full text-gray-900 rounded-full overflow-hidden cursor-default outline-none flex items-center justify-center aspect-square transition-all duration-300">
                        <div class="refraction-layer"></div>
                        <div class="specular-layer"></div>
                        <div class="glass-content-wrapper justify-center w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-[max(16px,2vmin)] h-[max(16px,2vmin)] portrait-icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </div>
                    </button>
                </div>
                <div id="filter-options-strip" class="strip-hidden h-full grid grid-cols-7 gap-[0.5vmin] items-center">
                    </div>
                <div id="project-search-wrapper" class="relative z-40 group flex-1 h-full cursor-text" onclick="document.getElementById('project-search-input').focus()">
                    <div class="search-pill aesthetic-glass aesthetic-glass-hover rounded-full overflow-hidden absolute inset-0">
                        <div class="refraction-layer"></div>
                        <div class="specular-layer"></div>
                        <div class="glass-content-wrapper w-full h-full flex flex-row items-center pl-[max(4px,0.25vw)]">
                            <div class="search-icon-box">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-[max(16px,2vmin)] h-[max(16px,2vmin)] portrait-icon-lg text-gray-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                            <input type="text" id="project-search-input" placeholder="Search project" class="bg-transparent border-none outline-none text-black font-medium text-[max(16px,0.5vw)] portrait-text-lg h-full placeholder-gray-900 placeholder:font-light select-text pr-[max(12px,3vmin)]">
                        </div>
                    </div>
                </div>
                <div id="project-search-dropdown">
                </div>
            </div>
            <div id="filter-panel"></div>
            <div id="project-metadata" class="hidden flex-row flex-wrap items-start gap-[0.8vmin] w-full pointer-events-auto select-none transition-all duration-300">
            </div>
        </div>
    </div>

    <div id="bottom-nav-container" class="fixed bottom-[max(10px,1.5vmin)] left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-row items-center gap-[1vmin] max-w-[60vw] transition-all duration-300">
        <a id="external-link-btn" target="_blank" class="hidden aesthetic-glass aesthetic-glass-hover portrait-lg h-[max(32px,4.5vmin)] min-w-[max(32px,4.5vmin)] transition-all duration-300 cursor-pointer outline-none no-underline whitespace-nowrap pointer-events-auto shrink-0 rounded-full">
            <div class="refraction-layer"></div>
            <div class="specular-layer"></div>
            <div class="glass-content-wrapper px-[max(10px,2.5vmin)] flex items-center justify-center gap-2">
                <span class="project-text-label text-gray-900 font-medium text-[max(14px,1.7vmin)] portrait-text-lg">Full Project</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[max(14px,1.7vmin)] w-[max(14px,1.7vmin)] portrait-icon-lg text-gray-900/70 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </div>
        </a>
    </div>

    <div id="error-container" class="hidden w-[80vmin] mt-[14vmin] p-[2vmin] bg-black-50 border border-blak-100 rounded-[2vmin] text-black-600 text-center shadow-sm">
        <span id="error-message" class="text-[2vmin]"></span>
    </div>

    <div class="w-full p-[1vmin]">
        <div id="gallery-grid" class="vmin-grid"></div>
    </div>

    <div id="scroll-trigger" class="mt-[2vmin] mb-[2vmin] py-[1vmin] text-gray-400 font-medium text-[1.5vmin] text-center transition-opacity duration-300 opacity-0">
        Loading more images...
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
